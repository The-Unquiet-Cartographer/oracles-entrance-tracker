				margin: auto;
				margin-top: 40px;
				box-sizing: border-box;
			}
			.clearfix::after { content: ""; display: table; clear: both; }
			a {
				float: left;
				text-align: center;
				color: white;
				width: calc(50% - 5px);
				padding: 10px;
				box-sizing: border-box;
				border: 1px solid white;
				border-radius: 4px;
			}
			a:nth-child(odd) {
				margin-right: 5px;
				background-color: #B92428;
			}
			a:nth-child(even) {
				margin-left: 5px;
				background-color: #4E4B98;
			}
			a:not(:nth-child(1)):not(:nth-child(2)) {
				margin-top: 5px;
			}
			a:not(:last-child):not(:nth-last-child(2)) {

			}
