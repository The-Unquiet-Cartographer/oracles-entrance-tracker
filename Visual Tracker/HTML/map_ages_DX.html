<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Ages Visual Tracker</title>
		<link rel="stylesheet" href="../CSS & SASS/map-markers.css">
		<link rel="stylesheet" href="../CSS & SASS/search.css">
		<style>
			body { margin: 0; background: black; position: relative; }
			#search-ctnr-inner, .marker-label { background: #4E4B98; }
		</style>
	</head>

	<body>

		<div id=search-ctnr-outer>
			<div id=search-ctnr-inner>
				<div id=search-ctnr-scrollArea>
					<div id=location-menu>
						<div id=add-ctrls>
							<p id=btn-clear>Clear</p>
							<input id=search-input title="Search" placeholder="Search">
						</div>
					</div>
				</div>
			</div>
		</div>

		<div id=map-labrynna-past-ctnr class=map-ctnr style="top:0px; left:0px">
			<img src="../Images/Ages/Sources/labrynna_past.png">
		</div>

		<div id=map-labrynna-present-ctnr class=map-ctnr style="top:0px; left:2240px">
			<img src="../Images/Ages/Areas/labrynna_present.png">
		</div>
		<div id=map-nuunHighlands-ctnr class=map-ctnr style="top:0px; left:3040px">
			<img src="../Images/Ages/Areas/nuunHighlands_dimitri.png">
		</div>
		<div id=map-greatMoblinsKeep-ctnr class=map-ctnr style="top:0px; left:3680px">
			<img src="../Images/Ages/Areas/greatMoblinsKeep_default.png">
		</div>

		<div id=map-zoraseas-past-ctnr class=map-ctnr style="top:1792px; left:0px">
			<img src="../Images/Ages/Areas/zoraseas_past_cropped.png">
		</div>
		
		<div id=map-zoraseas-present-ctnr class=map-ctnr style="top:1920px; left:2240px">
			<img src="../Images/Ages/Sources/zoraseas_present.png">
		</div>

	</body>

	<script src="../JS/scriptLoadManager.js"></script>
	<script src="../JS/a1_prototype_location.js"></script>
	<script src="../JS/a2_data_locations_ages.js"></script>
	<script src="../JS/appLogging.js"></script>
	<script src="../JS/b_sharedFunctions.js"></script>
<!--
	<script src="../JS/DX/c_ctrl_ages_DX.js"></script>
	<script src="../JS/e_eventListeners_shared.js"></script>
	<script src="../JS/DX/e2_eventListeners_agesDX.js"></script>
-->

<!--Delay running scripts as they require image elements to be fully loaded-->
	<script>
		const scriptSrcs = [
		/*
			"../JS/a1_prototype_location.js",
			"../JS/a2_data_locations_ages.js",
			"../JS/appLogging.js",
			"../JS/b_sharedFunctions.js",
		*/
			"../JS/DX/c_ctrl_ages_DX.js",
			"../JS/e_eventListeners_shared.js",
			"../JS/DX/e2_eventListeners_agesDX.js"
		];
		WaitForImages(() => {
			LoadScriptsInOrder(scriptSrcs);
		});
	</script>

</html>
